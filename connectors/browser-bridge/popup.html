<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reg Mitra Portal Bridge</title>
    <style>
      body { width: 320px; margin: 0; padding: 18px; background: #f8faf8; color: #14231c; font: 14px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 17px; }
      p { margin: 0 0 14px; color: #52645b; }
      button { width: 100%; min-height: 40px; border: 0; border-radius: 8px; background: #17392c; color: white; font-weight: 700; }
      button:disabled { opacity: .55; }
      #status { margin-top: 12px; padding: 10px; border: 1px solid #d7e0da; border-radius: 8px; background: white; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Reg Mitra Portal Bridge</h1>
    <p>Reads an approved status only after you click. Passwords, OTPs, CAPTCHAs and form fields are excluded.</p>
    <button id="inspect" type="button">Check this portal page</button>
    <div id="status" role="status">Open a supported MCA, GST or Income Tax page.</div>
    <script src="popup.js"></script>
  </body>
</html>
