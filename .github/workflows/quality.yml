name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test regulatory retrieval
        run: npm run rag:test
      - name: Evaluate regulatory retrieval
        run: npm run rag:evaluate
      - name: Test billing entitlements
        run: npm run billing:test
      - name: Check corpus integrity
        run: npm run corpus:check
      - name: Build production application
        run: npm run build
