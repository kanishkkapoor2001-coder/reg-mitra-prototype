name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install accessibility browser
        run: npx playwright install --with-deps chromium
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # One aggregate over every src/**/*.test.ts. A per-suite list is how the
      # calculator tests — the highest-risk logic in the product — stayed
      # ungated while a wrong interest start date shipped.
      - name: Run unit tests
        run: npm test
      - name: Evaluate regulatory retrieval
        run: npm run rag:evaluate
      - name: Check corpus integrity
        run: npm run corpus:check
      - name: Audit accessibility
        run: npm run test:a11y
      - name: Build production application
        run: npm run build
